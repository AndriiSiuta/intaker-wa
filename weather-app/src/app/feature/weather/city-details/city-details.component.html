@if (cityWeather(); as weather) {
  <mat-card class="weather-card">
    <mat-card-header>
      <mat-card-title>{{ weather.name }}, {{ weather.sys.country }}</mat-card-title>
      <mat-card-subtitle>{{ weather.weather[0].description }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Temperature: {{ weather.main.temp }}°C</p>
      <p>Humidity: {{ weather.main.humidity }}%</p>
      <p>Weather: {{ weather.weather[0].main }}</p>
    </mat-card-content>
  </mat-card>
}
